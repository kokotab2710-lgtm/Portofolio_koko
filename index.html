<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>koko | Graphic Designer for Social Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #c8f23b;
    --purple: #6b3cf5;
    --ink: #111111;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
  }

  .hero {
    position: relative;
    min-height: 100svh;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    align-items: center;
    gap: 2rem;
    padding: 4.5rem 5vw 0;
    overflow: hidden;
  }

  /* Lengkungan dekoratif seperti di desain Canva */
  .ring { position: absolute; border-radius: 50%; z-index: 0; pointer-events: none; }
  .ring.lime { width: 46vw; height: 46vw; left: -22vw; top: -8vw; border: 6vw solid var(--lime); }
  .ring.purple { width: 40vw; height: 40vw; left: 4vw; top: -26vw; border: 5vw solid var(--purple); }

  .brand-top {
    position: absolute; top: 1.4rem; left: 5vw; right: 5vw;
    display: flex; justify-content: space-between;
    font-size: 0.85rem; font-weight: 500; z-index: 3;
  }

  /* Panggung foto */
  .stage { position: relative; z-index: 1; align-self: end; height: min(86svh, 760px); }
  .panel {
    position: absolute; left: 50%; bottom: 0;
    width: 82%; height: 76%;
    transform: translateX(-50%);
    border-radius: 999px 999px 36px 36px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--purple), var(--lime), var(--purple));
    background-size: 300% 300%;
    animation: drift 9s ease-in-out infinite alternate, zoomOut 1.6s cubic-bezier(.2,.7,.2,1) both;
  }
  .panel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .me {
    position: absolute; left: 50%; bottom: 0;
    height: 96%; max-width: 100%; object-fit: contain; object-position: bottom;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    animation: zoomIn 1.4s cubic-bezier(.2,.7,.2,1) .25s both;
    z-index: 2;
  }
  .ph {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 62%; height: 80%; z-index: 2;
    border-radius: 999px 999px 0 0;
    border: 3px dashed rgba(255,255,255,.9);
    display: grid; place-items: center; text-align: center;
    color: #fff; font-weight: 500; padding: 1rem; background: rgba(0,0,0,.18);
  }
  .ph[hidden] { display: none; }

  /* Teks */
  .copy { position: relative; z-index: 2; padding-bottom: 4rem; }
  .hello {
    display: inline-block; background: var(--lime);
    font-weight: 800; font-size: clamp(1.1rem, 2vw, 1.6rem);
    padding: .2em .7em; border-radius: .5em; transform: rotate(-3deg);
    margin-bottom: 1rem;
    animation: rise .7s ease-out .5s both;
  }
  h1 {
    font-weight: 800;
    font-size: clamp(2.3rem, 5.2vw, 5rem);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  h1 .line { display: block; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  h1 .line:nth-child(1) { animation-delay: .65s; }
  h1 .line:nth-child(2) { animation-delay: .8s; }
  h1 .line:nth-child(3) { animation-delay: .95s; }
  .pill { display: inline-block; padding: 0 .22em; border-radius: .3em; }
  .pill.purple { background: var(--purple); color: #fff; }
  .pill.lime { background: var(--lime); }
  .pill.for { background: var(--purple); color: #fff; transform: rotate(-5deg); font-size: .85em; margin-left: .15em; }

  .about {
    display: flex; align-items: center; gap: .9rem;
    margin-top: 1.6rem; max-width: 30rem;
    animation: rise .8s ease-out 1.15s both;
  }
  .about img {
    width: 3.4rem; height: 3.4rem; border-radius: 50%;
    object-fit: cover; object-position: top; border: 2px solid var(--purple);
    flex: none; background: var(--lime);
  }
  .about p { font-size: .95rem; line-height: 1.45; color: #444; }

  @keyframes zoomIn { from { transform: translateX(-50%) scale(.72); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  @keyframes zoomOut { from { transform: translateX(-50%) scale(1.25); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  @keyframes rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; padding-top: 4rem; gap: 0; }
    .stage { height: 52svh; order: 1; }
    .copy { order: 2; padding: 1.5rem 0 2.5rem; }
    h1 { font-size: clamp(2rem, 9vw, 3rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="ring lime"></div>
    <div class="ring purple"></div>

    <div class="brand-top">
      <span>@mancoco_woy</span>
      <span>Creative by Koko</span>
    </div>

    <!-- Foto di depan, video di belakang -->
    <div class="stage">
      <div class="panel">
        <!-- Ganti dengan videomu: videos/latar.mp4 -->
        <video autoplay muted loop playsinline>
          <source src="videos/latar.mp4" type="video/mp4">
        </video>
      </div>
      <!-- Ganti dengan fotomu (PNG transparan): images/foto.png -->
      <img class="me" src="images/foto.png" alt="Foto Haesak"
           onerror="this.style.display='none';document.querySelector('.ph').hidden=false;">
      <div class="ph" hidden>Taruh foto PNG transparan di<br>images/foto.png</div>
    </div>

    <div class="copy">
      <span class="hello">Hello!!</span>
      <h1>
        <span class="line">I’m <span class="pill purple">Koko</span>,</span>
        <span class="line">I’m a Graphic</span>
        <span class="line"><span class="pill lime">Designer</span><span class="pill for">For</span></span>
        <span class="line">Social Media</span>
      </h1>
      <div class="about">
        <img src="images/foto.png" alt="" onerror="this.style.display='none'">
        <p>My real name is Koko al bakti, you can call me Koko because that’s my branding name.</p>
      </div>
    </div>
  </main>
</body>
</html>
